name: tuya-thermo-hygro-led
components:
  - id: main
    capabilities:
      - id: temperatureMeasurement
        version: 1
      - id: relativeHumidityMeasurement
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: TempHumiditySensor
  - id: display
    capabilities:
      - id: switch
        version: 1
  - id: ledSchedule
    label: LED Schedule
    capabilities:
      - id: switch
        version: 1
  - id: ledOnTime
    label: "LED On Time (00:00 - 23:59)"
    capabilities:
      - id: travellaugh21607.ledTime
        version: 1
  - id: ledOffTime
    label: "LED Off Time (00:00 - 23:59)"
    capabilities:
      - id: travellaugh21607.ledTime
        version: 1

deviceConfig:
  dashboard:
    states:
      - component: main
        capability: temperatureMeasurement
        version: 1
    actions: []
  detailView:
    - component: main
      capability: temperatureMeasurement
      version: 1
    - component: main
      capability: relativeHumidityMeasurement
      version: 1
    - component: main
      capability: refresh
      version: 1
    - component: display
      capability: switch
      version: 1
    - component: ledSchedule
      capability: switch
      version: 1
    - component: ledOnTime
      capability: travellaugh21607.ledTime
      version: 1
      patch:
        - op: replace
          path: /0/label
          value: "LED On Time (00:00 - 23:59)"
    - component: ledOffTime
      capability: travellaugh21607.ledTime
      version: 1
      patch:
        - op: replace
          path: /0/label
          value: "LED Off Time (00:00 - 23:59)"
  automation:
    conditions:
      - component: main
        capability: temperatureMeasurement
        version: 1
      - component: main
        capability: relativeHumidityMeasurement
        version: 1
      - component: display
        capability: switch
        version: 1
      - component: ledSchedule
        capability: switch
        version: 1
    actions:
      - component: main
        capability: refresh
        version: 1
      - component: display
        capability: switch
        version: 1
      - component: ledSchedule
        capability: switch
        version: 1

preferences:
  - name: deviceIp
    title: "Device IP"
    description: "Local IP address of the device"
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 7
      maxLength: 15
      default: "0.0.0.0"
  - name: deviceId
    title: "Device ID"
    description: "Tuya device ID (20 or 22 characters)"
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 20
      maxLength: 22
      default: "00000000000000000000"
  - name: localKey
    title: "Local Key"
    description: "Tuya local key (16 characters)"
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 16
      maxLength: 16
      default: "0000000000000000"
  - name: productId
    title: "Product ID"
    description: "Tuya product ID (16 characters)"
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 16
      maxLength: 16
      default: "0000000000000000"
  - name: deviceTempOffset
    title: "Temperature offset"
    description: "Range -8.0 to 8.0 in 0.1 steps"
    required: false
    preferenceType: number
    definition:
      minimum: -8
      maximum: 8
      default: 0
  - name: deviceHumOffset
    title: "Humidity offset"
    description: "Range -10 to 10"
    required: false
    preferenceType: integer
    definition:
      minimum: -10
      maximum: 10
      default: 0
