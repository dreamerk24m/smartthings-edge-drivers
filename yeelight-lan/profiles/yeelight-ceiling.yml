name: yeelight-ceiling
components:
  - id: main
    label: Main Light
    capabilities:
      - id: switch
        version: 1
      - id: switchLevel
        version: 1
      - id: colorTemperature
        version: 1
        config:
          values:
            - key: "colorTemperature.value"
              range: [2700, 6500]
      - id: refresh
        version: 1
      - id: synthetic.lightingEffectFade
        version: 1
      - id: synthetic.lightingEffectCircadian
        version: 1
    categories:
      - name: Light
  - id: moonlight
    label: Moonlight
    capabilities:
      - id: switch
        version: 1
      - id: switchLevel
        version: 1
    categories:
      - name: Light
